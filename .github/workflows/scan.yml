name: Setup-Scan

on:
  schedule:
    # Ziel: 11:13 und 14:23 New Yorker Zeit (normalerweise 17:13 und 20:23 Wiener Zeit), also gut eine
    # Stunde vor dem Schluss der 195-Minuten-Kerzen um 12:45 und 16:00. GitHub startet geplante Läufe oft
    # 5 bis 50 Minuten verspätet, deshalb der Vorlauf. Mit "timezone" stellt GitHub Sommer-/Winterzeit
    # selbst um. Das Script prüft zusätzlich, ob gerade ein passendes Zeitfenster ist.
    - cron: "13 11 * * 1-5"
      timezone: "America/New_York"
    - cron: "23 14 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:   # Knopf "Run workflow" für manuelle Läufe (ignoriert das Zeitfenster)

permissions:
  contents: write      # nur für die kleine Datei last_run.txt (hält den Zeitplan aktiv)
  pages: write
  id-token: write

concurrency:
  group: setup-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Scan ausführen
        id: scan
        run: python scanner.py --ci ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Webseite vorbereiten
        if: steps.scan.outputs.ran == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Webseite veröffentlichen
        if: steps.scan.outputs.ran == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Aktivität und Verlauf festhalten
        # state.json merkt sich, seit wann ein Treffer besteht. Die Commits halten außerdem den Zeitplan aktiv
        # (GitHub schaltet Zeitpläne in öffentlichen Repositories nach 60 Tagen ohne Aktivität ab).
        if: steps.scan.outputs.ran == 'true'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > last_run.txt
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add last_run.txt state.json
          git commit -m "Lauf $(cat last_run.txt)" || true
          git push || true
